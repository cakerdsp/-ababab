# 两阶段布图优化系统 - 完整参数配置示例
# Two-Phase Floorplan Optimization System - Complete Parameter Configuration Example
# 
# 本文件包含所有可配置的参数和详细说明
# This file contains all configurable parameters with detailed explanations
#
# 作者: PyFloorplan Team
# 版本: 2.0
# 更新: 2024-12

# ================================================================================
# 数据配置 - Data Configuration
# ================================================================================
data:
  benchmark: "gsrc"                    # 数据集类型: gsrc | mcnc
  dataset: "n10"                       # 测试用例: n10,n30,n50,n100,n200,n300 (gsrc) | ami33,ami49,apte,hp,xerox (mcnc)
  module_type: "soft"                  # 模块类型: soft | hard
                                       # soft: 软模块（可调整尺寸）
                                       # hard: 硬模块（固定尺寸）

# ================================================================================
# 算法配置 - Algorithm Configuration  
# ================================================================================
algorithm:
  name: "simulated_annealing"          # 优化算法: simulated_annealing | genetic
  representation: "sequence_pair"      # 表示方法: sequence_pair | btree
  max_iterations: 1000                 # 最大迭代次数: 推荐500-2000
                                       # 范围 Range: 1-10000，推荐 Recommended: 500-2000

# ================================================================================
# 模拟退火算法参数 - Simulated Annealing Parameters
# ================================================================================
simulated_annealing:
  initial_temperature: 1000.0         # 初始温度: 推荐500-2000
                                       # 范围 Range: 10.0-5000.0，推荐 Recommended: 500.0-2000.0
                                       
  final_temperature: 1.0               # 最终温度: 推荐0.5-2.0
                                       # 范围 Range: 0.1-10.0，推荐 Recommended: 0.5-2.0
                                       
  cooling_rate: 0.95                   # 冷却率: 推荐0.90-0.98
                                       # 范围 Range: 0.8-0.99，推荐 Recommended: 0.90-0.98
                                       
  temperature_schedule: "geometric"    # 温度调度策略 Temperature Schedule
                                       # 可选值 Options: "geometric" | "linear" | "exponential" | "logarithmic"
                                       
  moves_per_temperature: 50            # 每个温度下的移动次数 Moves per Temperature
                                       # 范围 Range: 10-200，推荐 Recommended: 30-100
                                       
  strict_legality: true                # 严格合法性检查 Strict Legality Check
                                       # true: 直接拒绝不合法解
                                       # false: 允许轻微违规但施加惩罚
                                       
  reheat_threshold: 0.05               # 重新加热阈值 Reheat Threshold
                                       # 当接受率低于此值时重新加热
                                       
  adaptive_cooling: false              # 自适应冷却 Adaptive Cooling
                                       # 根据接受率动态调整冷却速度

# ================================================================================
# 遗传算法参数 - Genetic Algorithm Parameters
# ================================================================================
genetic:
  population_size: 50                  # 种群大小: 推荐30-100
                                       # 范围 Range: 20-200，推荐 Recommended: 30-100
                                       
  crossover_rate: 0.8                  # 交叉率: 推荐0.7-0.9
                                       # 范围 Range: 0.5-0.95，推荐 Recommended: 0.7-0.9
                                       
  mutation_rate: 0.1                   # 变异率: 推荐0.05-0.2
                                       # 范围 Range: 0.01-0.3，推荐 Recommended: 0.05-0.2
                                       
  selection_method: "tournament"       # 选择方法: tournament | roulette | rank
                                       # 可选值 Options: "tournament" | "roulette" | "rank"
                                       
  tournament_size: 3                   # 锦标赛选择大小 Tournament Selection Size
                                       # 范围 Range: 2-10，推荐 Recommended: 2-5
                                       
  elitism_ratio: 0.1                   # 精英保留比例 Elitism Ratio
                                       # 范围 Range: 0.05-0.3，推荐 Recommended: 0.1-0.2
                                       
  repair_illegal: true                 # 修复不合法个体 Repair Illegal Individuals
                                       # true: 尝试修复不合法解
                                       # false: 直接淘汰不合法解
                                       
  diversity_maintenance: true          # 多样性维护 Diversity Maintenance
                                       # 防止种群过早收敛

# ================================================================================
# Pin分配配置 - Pin Assignment Configuration
# ================================================================================
pin_assignment:
  algorithm: "uniform_edge"            # 分配算法: uniform_edge(最快) | center_of_gravity(平衡) | greedy(最好)
                                       # Pin分配算法 Pin Assignment Algorithm
                                       # 可选值 Options:
                                       # "uniform_edge": O(1)超快速均匀边缘分配（推荐）
                                       # "center_of_gravity": 重心法分配（质量更好但较慢）
                                       # "greedy": 贪心法分配（质量最好但最慢）
                                       
  expansion_ratio: 1.2                 # 芯片扩展比例: 推荐1.1-1.5
                                       # 范围 Range: 1.05-2.0，推荐 Recommended: 1.1-1.5
                                       # 当Pin数量超过芯片周长时的扩展倍数
                                       
  verbose: false                       # 详细输出 Verbose Output
                                       # true: 输出Pin分配过程详细信息
                                       
  # 重心法专用参数 - Center of Gravity Specific Parameters
  prefer_corner_pins: true             # 优先放置角落Pin Prefer Corner Pins
                                       # 仅对center_of_gravity算法有效
                                       
  congestion_avoidance: true           # 拥塞避免 Congestion Avoidance
                                       # 仅对center_of_gravity算法有效
                                       
  max_pins_per_edge_unit: 3            # 每个边缘单位最大Pin数 Max Pins per Edge Unit
                                       # 仅对center_of_gravity算法有效
                                       
  distance_weight: 1.0                 # 距离权重 Distance Weight
                                       # 仅对center_of_gravity算法有效

# ================================================================================
# 评估系统配置 - Evaluation System Configuration
# ================================================================================
evaluation:
  chip_expansion_ratio: 1.2            # 评估用芯片扩展比例 Evaluation Chip Expansion Ratio
                                       # 用于合法性检查的芯片边界扩展
                                       
  calibration_samples: 50              # 校准样本数量 Calibration Samples
                                       # 用于动态归一化的样本数量
                                       
  # 评估权重配置 - Evaluation Weights Configuration
  weights:
    hpwl: 1.0                          # 线长权重: 推荐0.5-2.0
                                       # 线长权重 HPWL (Half-Perimeter Wirelength) Weight
                                       # 范围 Range: 0.0-5.0，推荐 Recommended: 0.5-2.0
                                       
    area: 0.5                          # 面积权重: 推荐0.3-1.0
                                       # 面积权重 Area Weight
                                       # 范围 Range: 0.0-2.0，推荐 Recommended: 0.3-1.0
                                       
    feedthrough: 10.0                  # 穿透权重: 推荐5.0-20.0
                                       # 穿透数权重 Feedthrough Weight
                                       # 范围 Range: 0.0-50.0，推荐 Recommended: 5.0-20.0
                                       # 控制网线穿过模块的惩罚
                                       
    whitespace: 0.1                    # 空白权重: 推荐0.05-0.2
                                       # 空白区域权重 Whitespace Weight
                                       # 范围 Range: 0.0-1.0，推荐 Recommended: 0.05-0.2
                                       
    legality: 0.15                     # 合法性权重: 推荐0.1-0.3
                                       # 合法性权重 Legality Weight
                                       # 范围 Range: 0.0-1.0，推荐 Recommended: 0.1-0.3
                                       # 对重叠和边界违规的惩罚

# ================================================================================
# 合法性检查配置 - Legality Check Configuration
# ================================================================================
legality:
  enable_overlap_check: true           # 启用重叠检查 Enable Overlap Check
  enable_boundary_check: true          # 启用边界检查 Enable Boundary Check
  enable_spacing_check: false          # 启用间距检查 Enable Spacing Check
  enable_alignment_check: false        # 启用对齐检查 Enable Alignment Check
  enable_keepout_check: false          # 启用禁区检查 Enable Keepout Check
  
  overlap_penalty_weight: 10000.0      # 重叠惩罚权重 Overlap Penalty Weight
  boundary_penalty_weight: 1000.0     # 边界惩罚权重 Boundary Penalty Weight
  spacing_penalty_weight: 100.0       # 间距惩罚权重 Spacing Penalty Weight

# ================================================================================
# 输出配置 - Output Configuration
# ================================================================================
output:
  verbose: true                        # 详细输出 Verbose Output
                                       # true: 输出优化过程详细信息
                                       
  save_results: true                   # 保存结果 Save Results
                                       # true: 保存结果到文件
                                       
  report_interval: 50                  # 报告间隔 Report Interval
                                       # 每多少次迭代输出一次进度信息
                                       
  result_format: "json"                # 结果格式 Result Format
                                       # 可选值 Options: "json" | "yaml" | "txt"
                                       
  save_intermediate: false             # 保存中间结果 Save Intermediate Results
                                       # true: 保存每次改进的中间结果
                                       
  # 可视化配置 - Visualization Configuration
  visualization:
    enabled: true                      # 启用可视化 Enable Visualization
                                       # true: 生成布局可视化图像
                                       
    draw_frequency: 100                # 绘图频率 Draw Frequency
                                       # 每多少次迭代生成一次图像
                                       
    save_initial: true                 # 保存初始布局 Save Initial Layout
    save_final: true                   # 保存最终布局 Save Final Layout
    
    output_dir: "visualization"        # 输出目录 Output Directory
                                       # 可视化文件的保存目录
                                       
    filename_prefix: "layout"          # 文件名前缀 Filename Prefix
    image_format: "png"                # 图像格式 Image Format
                                       # 可选值 Options: "png" | "svg" | "pdf"
                                       
    # 图像设置 - Image Settings
    image_width: 1200                  # 图像宽度 Image Width (pixels)
    image_height: null                 # 图像高度 Image Height (pixels, null=auto)
    dpi: 150                           # 图像分辨率 Image DPI
    
    # 绘图内容控制 - Drawing Content Control
    show_modules: true                 # 显示模块 Show Modules
    show_terminals: true               # 显示端口 Show Terminals
    show_nets: false                   # 显示网线 Show Nets (可能很密集)
    show_grid: true                    # 显示网格 Show Grid
    show_iteration: true               # 显示迭代次数 Show Iteration Number
    show_metrics: true                 # 显示关键指标 Show Key Metrics
    
    # 颜色设置 - Color Settings
    soft_module_color: "#3498db"       # 软模块颜色 Soft Module Color (蓝色)
    hard_module_color: "#e74c3c"       # 硬模块颜色 Hard Module Color (红色)
    terminal_color: "#2ecc71"          # 端口颜色 Terminal Color (绿色)
    background_color: "#ffffff"        # 背景颜色 Background Color (白色)
    grid_color: "#ecf0f1"              # 网格颜色 Grid Color (浅灰色)
    border_color: "#34495e"            # 边界颜色 Border Color (深灰色)
    
    # 性能设置 - Performance Settings
    use_threading: true                # 使用独立线程 Use Threading
                                       # 避免绘图阻塞优化过程
                                       
    max_queue_size: 5                  # 最大队列大小 Max Queue Size
                                       # 限制内存使用

# ================================================================================
# 实验配置 - Experimental Configuration
# ================================================================================
experimental:
  enable_adaptive_weights: false       # 启用自适应权重 Enable Adaptive Weights
                                       # 根据优化进度动态调整评估权重
                                       
  enable_multi_objective: false        # 启用多目标优化 Enable Multi-Objective
                                       # 帕累托前沿优化
                                       
  enable_parallel_evaluation: false    # 启用并行评估 Enable Parallel Evaluation
                                       # 使用多线程加速评估
                                       
  random_seed: null                    # 随机种子 Random Seed
                                       # null: 每次运行随机种子不同
                                       # 数字: 固定种子，确保结果可重现
                                       
  debug_mode: false                    # 调试模式 Debug Mode
                                       # 输出更多调试信息

# ================================================================================
# 性能优化配置 - Performance Optimization Configuration  
# ================================================================================
performance:
  max_memory_usage: "2GB"              # 最大内存使用 Max Memory Usage
                                       # 控制内存使用上限
                                       
  enable_caching: true                 # 启用缓存 Enable Caching
                                       # 缓存计算结果提升性能
                                       
  cache_size_limit: 1000               # 缓存大小限制 Cache Size Limit
                                       # 最大缓存条目数
                                       
  enable_profiling: false              # 启用性能分析 Enable Profiling
                                       # 详细的性能分析和统计

# ================================================================================
# 回调和扩展配置 - Callback and Extension Configuration
# ================================================================================
callbacks:
  enable_progress_callback: true       # 启用进度回调 Enable Progress Callback
  enable_improvement_callback: false   # 启用改进回调 Enable Improvement Callback
  enable_convergence_callback: false   # 启用收敛回调 Enable Convergence Callback
  
  # 自定义回调函数 - Custom Callback Functions
  custom_callbacks: []                 # 自定义回调函数列表

# ================================================================================
# 文件路径配置 - File Path Configuration
# ================================================================================
paths:
  data_root: "GSRC"                    # 数据根目录 Data Root Directory
  output_root: "results"               # 输出根目录 Output Root Directory
  cache_root: "cache"                  # 缓存根目录 Cache Root Directory
  log_root: "logs"                     # 日志根目录 Log Root Directory

# ================================================================================
# 配置文件元信息 - Configuration Metadata
# ================================================================================
metadata:
  config_version: "2.0"                # 配置文件版本 Configuration Version
  created_by: "PyFloorplan Team"       # 创建者 Created By
  description: "Complete parameter configuration example for two-phase floorplan optimization"
  last_modified: "2024-12"             # 最后修改时间 Last Modified
  
  # 推荐配置组合 - Recommended Configuration Combinations
  recommended_combinations:
    fast_test:                         # 快速测试配置
      algorithm.max_iterations: 100
      pin_assignment.algorithm: "uniform_edge"
      output.visualization.enabled: false
      
    standard_quality:                  # 标准质量配置
      algorithm.max_iterations: 1000
      pin_assignment.algorithm: "center_of_gravity"
      output.visualization.enabled: true
      
    high_quality:                      # 高质量配置
      algorithm.max_iterations: 2000
      pin_assignment.algorithm: "greedy"
      evaluation.calibration_samples: 100