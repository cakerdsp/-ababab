# MCNC基准测试配置 - GA + Sequence Pair + ami33硬模块
data:
  benchmark: "mcnc"                    # 数据集类型: gsrc | mcnc  
  dataset: "ami33"                     # 测试用例: ami33, ami49, apte, hp, xerox
  module_type: "hard"                  # 模块类型: soft | hard

# 宏模块布图阶段
algorithm:
  name: "genetic_algorithm"            # 优化算法: genetic_algorithm | simulated_annealing
  representation: "sequence_pair"      # 表示方法: btree | sequence_pair
  max_iterations: 150                  # 遗传算法的代数 (MCNC稍微增加)

# 遗传算法参数 - 针对MCNC优化
genetic_algorithm:
  population_size: 60                  # 种群大小 (稍大一些)
  crossover_rate: 0.85                 # 交叉率 (稍高一些)
  mutation_rate: 0.12                  # 变异率 (稍高一些)
  selection_method: "tournament"       # 选择方法: tournament | roulette | rank
  tournament_size: 4                   # 锦标赛选择大小 (稍大一些)
  elitism_ratio: 0.15                  # 精英保留比例 (稍高一些)
  strict_legality: true                # 严格合法性检查
  repair_illegal: true                 # 修复不合法个体

# 引脚分配配置
pin_assignment:
  algorithm: "center_of_gravity"       # MCNC推荐重心法
  expansion_ratio: 1.15                # 稍大一些的扩展比例
  verbose: false                       # 详细输出

# 评估系统
evaluation:
  chip_expansion_ratio: 1.25           # MCNC通常需要更大空间
  
  # Feedthrough计算方法
  feedthrough_method: "ftafp"          # Feedthrough方法: "original" | "ftafp"
  
  # 基准函数校准参数
  calibration:
    enabled: true                      # 启用基准函数校准
    samples: 12                        # 稍多的校准样本
    verbose: true                      # 显示校准过程
  
  # 评估权重 - MCNC调优
  weights:
    hpwl: 1.0                         # 线长权重
    area: 0.4                         # 面积权重 (MCNC硬模块面积相对固定)
    feedthrough_count: 0.5            # Feedthrough数量权重 (MCNC更重要)
    feedthrough_wirelength: 0.5       # Feedthrough线长权重
    whitespace: 0.15                  # 空白区域权重 (稍高)
    legality: 0.1                     # 合法性权重

# 输出配置
output:
  verbose: true
  
  # 可视化配置  
  visualization:
    enabled: true
    
    # 布局图配置
    layout:
      show_module_labels: true
      show_net_connections: true       # MCNC显示连接有用
      color_scheme: "classic"          # MCNC用经典配色
      
    # 输出格式
    formats:
      png: true
      pdf: true                        # MCNC保存PDF用于分析
      
    # 分辨率和尺寸
    dpi: 300
    figsize: [14, 12]                  # 更大画布
    
  # 结果保存
  save_results: true
  save_intermediate: false
  save_pl_file: true 