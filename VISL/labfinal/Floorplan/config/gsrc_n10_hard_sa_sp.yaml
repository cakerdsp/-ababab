# 两阶段布图配置 - SA + Sequence Pair
data:
  benchmark: "gsrc"                    # 数据集类型: gsrc | mcnc  
  dataset: "n10"                       # 测试用例: n10, n30, n50, n100, n200, n300
  module_type: "hard"                  # 模块类型: soft | hard

# 宏模块布图阶段
algorithm:
  name: "simulated_annealing"          # 优化算法: genetic | simulated_annealing
  representation: "sequence_pair"      # 表示方法: btree | sequence_pair
  max_iterations: 500

# 模拟退火参数
simulated_annealing:
  initial_temperature: 1000.0
  cooling_rate: 0.95
  min_temperature: 1.0
  moves_per_temperature: 50


  


# 引脚分配配置
pin_assignment:
  algorithm: "center_of_gravity"            # 引脚分配算法: greedy | center_of_gravity | uniform_edge
  expansion_ratio: 1.2                 # 芯片扩展比例
  verbose: false                       # 详细输出
  
  # 重心法专用参数
  prefer_corner_pins: true             # 优先放置角落Pin
  distance_weight: 1.0                 # 距离权重
  congestion_avoidance: true           # 拥塞避免
  max_pins_per_edge_unit: 3            # 每个边缘单位最大Pin数

# 评估系统
evaluation:
  feedthrough_method: "ftafp"          # 🎯 启用FTAFP方法：使用更精确的feedthrough分析
  chip_expansion_ratio: 1.2
  weights:
    hpwl: 1.0
    area: 0.5
    feedthrough: 0.3
    # 基准函数校准参数
  calibration:
    enabled: true                      # 启用基准函数校准
    samples: 10                        # 校准样本数量（减少以加快测试）
    verbose: true                      # 显示校准过程

# 输出配置
output:
  verbose: true
  save_results: true
  visualization:
    enabled: true
    draw_frequency: 100                 # 改为10，更容易触发
    output_dir: "visualization"
    image_format: "png"
    dpi: 150
    use_threading: false
    
    # 可视化配置
    show_grid: true
    show_border: true
    show_modules: true
    show_terminals: true
    show_nets: false
    
    # 样式配置
    figure_size: [12, 10]
    background_color: "white"
    
    # 颜色配置
    soft_module_color: "#ff9999"
    hard_module_color: "#ffcc99"
    terminal_color: "green"
    grid_color: "#cccccc"
    border_color: "black"