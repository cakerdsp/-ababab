# 两阶段布图配置 - SA + Sequence Pair + 基准函数归一化
data:
  benchmark: "gsrc"                    # 数据集类型: gsrc | mcnc  
  dataset: "n10"                       # 测试用例: n10, n30, n50, n100, n200, n300
  module_type: "hard"                  # 模块类型: soft | hard

# 宏模块布图阶段
algorithm:
  name: "simulated_annealing"          # 优化算法: genetic | simulated_annealing
  representation: "sequence_pair"      # 表示方法: btree | sequence_pair
  max_iterations: 500

# 模拟退火参数
simulated_annealing:
  initial_temperature: 1000.0
  final_temperature: 1.0
  cooling_rate: 0.95
  moves_per_temperature: 50

# 引脚分配配置
pin_assignment:
  algorithm: "uniform_edge"            # 引脚分配算法: greedy | center_of_gravity | uniform_edge
  expansion_ratio: 1.1                 # 芯片扩展比例
  verbose: false                       # 详细输出

# 评估系统 - 基准函数归一化配置
evaluation:
  chip_expansion_ratio: 1.2
  
  # 🎯 Feedthrough计算方法选择
  feedthrough_method: "original"       # Feedthrough方法: "original" | "ftafp"
  
  # 基准函数校准参数
  calibration:
    enabled: true                      # 启用基准函数校准
    samples: 10                        # 校准样本数量（减少以加快测试）
    verbose: true                      # 显示校准过程
  
  # 🎯 评估权重 - 分离feedthrough数量和线长权重
  weights:
    hpwl: 1.0                         # 线长权重
    area: 0.5                         # 面积权重
    feedthrough_count: 0.3            # Feedthrough数量权重
    feedthrough_wirelength: 0.0       # Feedthrough线长权重 (原始方法为0)
    whitespace: 0.1                   # 空白区域权重
    legality: 0.1                     # 合法性权重

# 输出配置
output:
  verbose: true
  save_results: true
  visualization:
    enabled: true
    draw_frequency: 100
    output_dir: "visualization"
    image_format: "png"
    dpi: 150
    use_threading: false
    
    # 可视化配置
    show_grid: true
    show_border: true
    show_modules: true
    show_terminals: true
    show_nets: false
    
    # 样式配置
    figure_size: [12, 10]
    background_color: "white"
    
    # 颜色配置
    soft_module_color: "#ff9999"
    hard_module_color: "#ffcc99"
    terminal_color: "green"
    grid_color: "#cccccc"
    border_color: "black" 